name: Collect official competitions and deploy

on:
  push:
    branches: [main]
  schedule:
    # 06:00 KST (GitHub cron uses UTC)
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test stored fixtures
        run: npm test

      # The collector writes through a validated temporary file. If either
      # official source fails, this step exits before the existing feed changes.
      - name: Collect AIDA and CMAS official calendars
        run: npm run collect:competitions

      - name: Type check
        run: npm run typecheck

      - name: Build
        env:
          VITE_GOOGLE_SHEET_API_URL: ${{ secrets.VITE_GOOGLE_SHEET_API_URL }}
          VITE_KAKAO_MAP_API_KEY: ${{ secrets.VITE_KAKAO_MAP_API_KEY }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-failure:
    if: ${{ always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure') }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Telegram notification on failure
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚨 프리다이빙 공식 일정 수집 또는 배포 실패
            - 실행: ${{ github.event_name }}
            - 로그: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
