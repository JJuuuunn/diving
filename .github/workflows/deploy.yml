name: Sync competitions and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sync_status: ${{ steps.competition_sync.outputs.status }}
      sync_message: ${{ steps.competition_sync.outputs.message }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync managed competition sheet
        id: competition_sync
        env:
          VITE_COMPETITION_GOOGLE_APPS_SCRIPT_API_URL: ${{ secrets.VITE_COMPETITION_GOOGLE_APPS_SCRIPT_API_URL }}
        run: npm run sync:competitions -- --fallback

      - name: Validate competition snapshot
        run: npm run validate:competitions

      - name: Test
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build
        env:
          VITE_MEDICAL_GOOGLE_APPS_SCRIPT_API_URL: ${{ secrets.VITE_MEDICAL_GOOGLE_APPS_SCRIPT_API_URL }}
          VITE_COMPETITION_GOOGLE_APPS_SCRIPT_API_URL: ${{ secrets.VITE_COMPETITION_GOOGLE_APPS_SCRIPT_API_URL }}
          VITE_KAKAO_MAP_API_KEY: ${{ secrets.VITE_KAKAO_MAP_API_KEY }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-sync-warning:
    if: needs.build.outputs.sync_status == 'fallback'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Telegram competition fallback warning
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ⚠️ 대회 일정 Google Sheets 동기화 실패 — 직전 정상본으로 배포
            - 원인: ${{ needs.build.outputs.sync_message }}
            - 실행: ${{ github.event_name }}
            - 로그: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  notify-failure:
    if: ${{ always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure') }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Telegram deployment failure
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚨 프리다이빙 일정 빌드 또는 배포 실패
            - 실행: ${{ github.event_name }}
            - 로그: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
